<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A7A6B"/>
      <stop offset="100%" stop-color="#2C3E2D"/>
    </linearGradient>
    <clipPath id="hexClip">
      <polygon points="200,20 347,110 347,290 200,380 53,290 53,110"/>
    </clipPath>
  </defs>

  <!-- Hexagon outline -->
  <polygon points="200,20 347,110 347,290 200,380 53,290 53,110"
           fill="none" stroke="#1A7A6B" stroke-width="4"/>

  <!-- Inner hexagon ring -->
  <polygon points="200,48 323,126 323,274 200,352 77,274 77,126"
           fill="none" stroke="#1A7A6B" stroke-width="1.5" opacity="0.3"/>

  <!-- AI data connection lines -->
  <g clip-path="url(#hexClip)">
    <rect x="53" y="120" width="294" height="8" fill="url(#grad1)" rx="2"/>
  </g>
  <g clip-path="url(#hexClip)">
    <rect x="53" y="180" width="294" height="8" fill="#1A7A6B" rx="2"/>
  </g>
  <g clip-path="url(#hexClip)">
    <rect x="53" y="240" width="294" height="8" fill="#C9953C" rx="2"/>
  </g>

  <!-- Connected node dots representing AI network -->
  <circle cx="200" cy="60" r="5" fill="#C9953C"/>
  <circle cx="170" cy="300" r="4" fill="#1A7A6B" opacity="0.7"/>
  <circle cx="230" cy="300" r="4" fill="#1A7A6B" opacity="0.7"/>

  <!-- Signal arcs representing AI search/discovery -->
  <path d="M 140,200 Q 170,170 200,170 Q 230,170 260,200"
        fill="none" stroke="#C9953C" stroke-width="1.5" opacity="0.3"/>
  <path d="M 120,220 Q 160,190 200,190 Q 240,190 280,220"
        fill="none" stroke="#C9953C" stroke-width="1" opacity="0.2"/>
</svg>
